<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="inspector.css" />
  </head>
  <body>
    <div class="item">
      <label for="win">Aktiv-Fenster (Sekunden)</label>
      <input id="win" type="number" min="10" step="10" data-setting="activeWindowSec" data-default="120" />
      <div class="hint">
        Claude gilt als „aktiv", wenn ein Session-Transkript in
        <code>~/.claude/projects</code> innerhalb dieser Zeit geschrieben wurde.
      </div>
    </div>
    <script src="inspector.js"></script>
  </body>
</html>
